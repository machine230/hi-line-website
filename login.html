<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Sign In — Hi-Line Flying Club</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js?v=3"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--body-bg);
        }

        .bg-img {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center 40%;
            z-index: 0;
        }
        .bg-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(10,22,16,0.6) 0%, rgba(10,22,16,0.88) 100%);
            z-index: 1;
        }

        .login-wrap {
            position: relative; z-index: 2;
            width: 100%; padding: 24px;
            display: flex; flex-direction: column;
            align-items: center;
        }

        .site-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; font-size: 1.8em;
            letter-spacing: 3px; color: #fff;
            text-decoration: none; margin-bottom: 6px;
        }
        .site-logo span { color: #5BB8E8; }

        .site-tagline {
            color: rgba(255,255,255,0.4);
            font-size: 0.82em;
            margin-bottom: 36px;
            letter-spacing: 0.5px;
        }

        .login-card {
            background: rgba(13,30,32,0.82);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 36px 40px;
            width: 100%; max-width: 380px;
            backdrop-filter: blur(16px);
            text-align: center;
        }

        .login-card h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; font-size: 0.72em;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase; letter-spacing: 3px;
            margin-bottom: 16px;
        }

        .login-card p {
            color: rgba(255,255,255,0.6);
            font-size: 0.9em;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .login-btn {
            display: block;
            width: 100%; padding: 14px;
            background: #E8A030; color: #fff;
            border: none; border-radius: 8px;
            font-size: 0.95em; font-weight: 700;
            cursor: pointer; text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            transition: background 0.2s;
        }
        .login-btn:hover { background: #F0B84A; }

        .powered {
            margin-top: 18px;
            font-size: 0.75em;
            color: rgba(255,255,255,0.32);
            letter-spacing: 0.3px;
        }
        .powered a { color: #5BB8E8; text-decoration: none; }
        .powered a:hover { text-decoration: underline; }

        .back-link {
            margin-top: 20px;
            font-size: 0.8em;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <img class="bg-img" src="images/n2134y.jpg" alt="" onerror="this.style.display='none'">
    <div class="bg-overlay"></div>

    <div class="login-wrap">
        <a href="index.html" class="site-logo">Hi-Line</a>
        <div class="site-tagline">Hi-Line Flying Club · KRNT</div>

        <div class="login-card">
            <h2>Member Sign In</h2>
            <p>Scheduling, squawks, flight logs, and billing live in the FlightBoard member portal. Sign in there to access your account.</p>
            <a class="login-btn" href="https://www.flightboard.app/login">Sign in to Member Portal →</a>
            <div class="powered">Secured by <a href="https://flightboard.app">FlightBoard</a></div>
        </div>

        <a href="index.html" class="back-link">← Back to home</a>
    </div>
</body>
</html>
