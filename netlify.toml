[build]
  publish   = "."
  functions = "netlify/functions"   # proxyWeather (weather CORS proxy) + joinWaitlist (Resend email)
  # Both functions are zero-dependency .mjs using built-in fetch — no bundler config or package.json needed.

# ── Security headers ─────────────────────────────────────────
# Static club site. Member portal (auth, scheduling, billing) lives on
# FlightBoard (flightboard.app) — no in-house app or Supabase here anymore.
# External hosts still needed: Google Fonts, unpkg (Leaflet + Lucide),
# OpenStreetMap tiles + ChartBundle (W&B / weather maps), aviationweather.gov.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://unpkg.com 'unsafe-inline'; font-src https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://wms.chartbundle.com; connect-src 'self' https://aviationweather.gov; frame-ancestors 'none';"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Clean URL aliases ─────────────────────────────────────────
[[redirects]]
  from   = "/login"
  to     = "/login.html"
  status = 200

[[redirects]]
  from   = "/join"
  to     = "/join.html"
  status = 200

[[redirects]]
  from   = "/weather"
  to     = "/weather.html"
  status = 200

[[redirects]]
  from   = "/wb"
  to     = "/wb.html"
  status = 200

# Legacy portal paths now live on FlightBoard — send old bookmarks to the portal.
[[redirects]]
  from   = "/dashboard"
  to     = "https://www.flightboard.app/login"
  status = 301
  force  = true

# ── Custom error page ─────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
